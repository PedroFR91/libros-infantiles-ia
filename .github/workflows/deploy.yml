name: 🚀 Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 📦 Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: 🔀 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: 🔑 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "📥 Pulling new image..."
            docker pull ghcr.io/pedrofr91/libros-infantiles-ia:latest

            echo "♻️ Restarting container..."
            cd ~/editorial
            docker compose -f docker-compose.yml up -d --no-build libros-ia

            echo "⏳ Waiting for health check..."
            sleep 10
            for i in $(seq 1 12); do
              STATUS=$(docker exec libros-ia wget -q -O- http://localhost:3000/api/health 2>/dev/null | grep -o '"status":"[^"]*"' || echo "not ready")
              echo "  Attempt $i: $STATUS"
              if echo "$STATUS" | grep -q '"ok"'; then
                echo "✅ Deploy successful!"
                exit 0
              fi
              sleep 5
            done
            echo "❌ Health check failed after 60s"
            docker logs libros-ia --tail 30
            exit 1
